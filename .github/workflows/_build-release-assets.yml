name: Build server release assets

on:
  workflow_call:
    inputs:
      ref:
        description: Exact cc-switch-server Git commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release contracts
    runs-on: ubuntu-latest
    env:
      CC_SWITCH_ROUTER_AUDIT_ROOT: ${{ github.workspace }}/provider-audit/cc-switch-router
      CC_SWITCH_ROUTER_ROOT: ${{ github.workspace }}/provider-audit/cc-switch-router
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Checkout pinned Router audit baseline
        uses: actions/checkout@v4
        with:
          repository: Xiechengqi/cc-switch-router
          ref: 0b737e09e78a268e0dbb2de7c4aec0b61ee7e04d
          path: provider-audit/cc-switch-router
          fetch-depth: 0

      - name: Install static-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web-src --ignore-scripts --no-audit --no-fund

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Run static contract checks
        run: scripts/static-checks.sh

      - name: Run startup-contract regression tests
        run: |
          cargo test domain::providers::registry::tests --lib
          cargo test amazon_q --lib
          cargo test web_session --lib

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            asset: cc-switch-server-linux-amd64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            asset: cc-switch-server-linux-arm64

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Verify checkout
        env:
          EXPECTED_COMMIT: ${{ inputs.ref }}
        run: |
          actual_commit="$(git rev-parse HEAD)"
          expected_commit="$(git rev-parse "${EXPECTED_COMMIT}^{commit}")"
          if [[ "${actual_commit}" != "${expected_commit}" ]]; then
            echo "checked out ${actual_commit}, expected ${expected_commit}" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web-src --ignore-scripts --no-audit --no-fund

      - name: Build embedded web assets
        run: SKIP_NPM_INSTALL=1 scripts/sync/build-web.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cross-architecture runtime
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Export build metadata
        run: |
          {
            echo "CC_SWITCH_BUILD_COMMIT=$(git rev-parse HEAD)"
            echo "CC_SWITCH_BUILD_COMMIT_SHORT=$(git rev-parse --short=12 HEAD)"
            echo "CC_SWITCH_BUILD_COMMIT_MESSAGE=$(git log -1 --format=%s)"
            echo "CC_SWITCH_BUILD_COMMIT_TIME=$(git log -1 --format=%cI)"
            echo "CC_SWITCH_BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "CC_SWITCH_BUILD_TARGET=${{ matrix.target }}"
            echo "CC_SWITCH_BUILD_PROFILE=release"
            echo "CC_SWITCH_BUILD_RUSTC_VERSION=$(rustc --version)"
            echo "CC_SWITCH_BUILD_DIRTY=false"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Prepare release asset
        run: |
          cp "target/${{ matrix.target }}/release/cc-switch-server" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls -lh "${{ matrix.asset }}" "${{ matrix.asset }}.sha256"

      - name: Smoke release asset
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: scripts/smoke/release-asset-startup.sh "./${RELEASE_ASSET}" "${RELEASE_ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
